[tools]
dotnet = [
  { version = "11.0.100" },
  # The ASP.NET Core runtime (which includes the base runtime): the generators (Kiota and Refitter) and the net10.0 tests run on .NET 10.
  { version = "10.0.15", runtime = "aspnetcore" },
]
"github:microsoft/apm" = { version = "v0.36.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.2", bin = "skillfile" }
hk = "2.13.0"
pkl = "0.33.0"
node = "26.13.1"
actionlint = "1.7.12"
biome = "2.5.2"

"dotnet:gitversion.tool" = "6.6.0"
"dotnet:dotnet-reportgenerator-globaltool" = "5.5.3"
"dotnet:jetbrains.resharper.globaltools" = "2025.3.3"
"dotnet:jetbrains.dotcover.commandlinetools" = "2025.3.3"
"dotnet:jetbrains.dottrace.globaltools" = "2025.3.3"
"dotnet:dotnet-coverage" = "18.5.1"
"dotnet:dotnet-outdated-tool" = "4.7.0"
"dotnet:verify.tool" = "0.7.0"
"dotnet:gitreleasemanager.tool" = "0.20.0"
"dotnet:NuGet.Mcp.Server" = "1.4.3"
tombi = "1.11.3"
oxfmt = "0.75.0"

[tasks]
build = { run = "dotnet run build/Build.cs" }
docs = { run = "npm run dev --workspace docs", description = "Start the Astro/Starlight dev server" }
"docs:preview" = { run = "npm run preview --workspace docs", description = "Preview built Starlight site" }
"docs:build" = { run = "npm run build --workspace docs", description = "Build the Starlight site" }
"sample:pack" = { run = "dotnet msbuild build/pack.proj", dir = "{{config_root}}/sample/ChirographSample", description = "Pack src/** locally at 0.0.0-sample for sample/ChirographSample" }
"sample:run" = { run = "dotnet run build/run-sample.cs", dir = "{{config_root}}/sample/ChirographSample", description = "Pack if needed, build sample/ChirographSample, start Rockets.Api and check what each app prints against sample/ChirographSample/expected" }

[settings]
experimental = true
prereleases = true

[env]
HK_MISE = 1
npm_config_cache = "{{env.HOME}}/.local/share/mise/npm-cache"

[deps.npm]
auto = true
